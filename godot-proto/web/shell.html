<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
		<meta name="theme-color" content="#ECE3D0">
		<title>$GODOT_PROJECT_NAME</title>
		<!-- Своя оболочка веб-экспорта (Project → Export → Web → HTML → Custom HTML Shell = res://web/shell.html):
		     фон #ECE3D0 как у главной, кубик «А» и спокойная полоска загрузки, без логотипа Godot.
		     Основа — стандартный misc/dist/html/full-size.html из Godot 4.7; логика запуска движка не менялась. -->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	background-color: #ECE3D0;
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	background-color: #ECE3D0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 28px;
	visibility: hidden;
	transition: opacity .35s ease;
	font-family: "DejaVu Sans", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
}

#status.fade {
	opacity: 0;
}

#status-cube {
	width: 120px;
	height: 120px;
	animation: breathe 2.4s ease-in-out infinite;
}

@keyframes breathe {
	0%, 100% { transform: scale(1); }
	50% { transform: scale(1.06); }
}

#status-bar {
	position: relative;
	width: min(360px, 60vw);
	height: 14px;
	border-radius: 7px;
	background: #DDD2BC;
	overflow: hidden;
	display: none;
}

#status-fill {
	position: absolute;
	left: 0;
	top: 0;
	bottom: 0;
	width: 0;
	border-radius: 7px;
	background: #F2B27A;
	transition: width .4s ease-out;
}

#status-bar.indeterminate #status-fill {
	width: 30%;
	animation: slide 1.8s ease-in-out infinite;
}

@keyframes slide {
	0% { left: -30%; }
	100% { left: 100%; }
}

#status-notice {
	display: none;
	max-width: 32rem;
	margin: 0 2rem;
	padding: 1rem 1.25rem;
	border-radius: 12px;
	background: #F7F1E4;
	color: #3C3228;
	line-height: 1.4;
	text-align: center;
	font-size: 16px;
}

#status-notice a {
	color: #3C3228;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Браузер не поддерживает canvas.
		</canvas>

		<noscript>
			Для урока нужен включённый JavaScript.
		</noscript>

		<div id="status">
			<img id="status-cube" src="index.apple-touch-icon.png" alt="">
			<div id="status-bar" class="indeterminate"><div id="status-fill"></div></div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusBar = document.getElementById('status-bar');
	const statusFill = document.getElementById('status-fill');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			initializing = false;
			statusOverlay.classList.add('fade');
			setTimeout(() => statusOverlay.remove(), 400);
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusBar.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		const back = document.createElement('a');
		back.href = '../' + location.search.replace(/([?&])step=[^&]*&?/, '$1').replace(/[?&]$/, '');
		back.textContent = 'Вернуться к буквам';
		statusNotice.appendChild(back);
	}

	function displayFailureNotice(err) {
		console.error(err);
		let msg = 'Не получилось загрузить урок. Проверьте интернет и обновите страницу.';
		if (err instanceof Error && err.message) {
			msg += '\n(' + err.message + ')';
		} else if (typeof err === 'string') {
			msg += '\n(' + err + ')';
		}
		setStatusNotice(msg);
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice('Этому браузеру не хватает возможностей для урока:\n' + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusBar.classList.remove('indeterminate');
					statusFill.style.width = Math.min(100, (current / total) * 100).toFixed(1) + '%';
				} else {
					statusBar.classList.add('indeterminate');
					statusFill.style.width = '';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
