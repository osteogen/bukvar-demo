<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ECE3D0">
<title>Букварь — буквы</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preload" href="assets/dejavu-sans-bold-cyr.woff2" as="font" type="font/woff2" crossorigin>
<!-- Главная страница: лёгкая копия экрана букв из Godot (menu/letters_menu.gd). Godot (~67 МБ) грузится только
     после тапа по «А» — на странице lesson-a/. Сетка, палитра и цвета — как в letters_menu.gd. -->
<style>
@font-face { font-family: "DejaVuBk"; src: url("assets/dejavu-sans-bold-cyr.woff2") format("woff2"); font-weight: 700; font-display: block; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ECE3D0; }
body { position: fixed; inset: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
/* #stage — ровно видимая область (размер ставит layout() по visualViewport), всё внутри; ничего не выходит за край */
#stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; visibility: hidden; }
/* зонд: видимая высота (dvh) и вырезы экрана (safe-area: «чёлка», полоска «домой» на iPhone/iPad) */
#vp { position: fixed; left: 0; top: 0; width: 100%; height: 100%; height: 100dvh; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  box-sizing: border-box; }
/* полосы экрана: верх (меню, пока пустое) · кубики · черта · ряд круглых кнопок. Размеры задаёт layout() в JS. */
#topbar { position: absolute; left: 0; right: 0; top: 0; }
.cube { position: absolute; width: 124px; height: 124px; padding: 0; margin: 0; border: 0; outline: none; cursor: pointer;
  background: transparent center / 100% 100% no-repeat; -webkit-appearance: none; appearance: none; }
/* лицевая грань кубика: 9.7/19.4/93 из 124 (как в letters_menu.gd); шрифт 52/124 от кубика — задаётся в JS */
.cube span { position: absolute; left: 7.823%; top: 15.645%; width: 75%; height: 75%; display: flex; align-items: center;
  justify-content: center; font: 700 52px/normal "DejaVuBk", "DejaVu Sans", sans-serif; pointer-events: none; }
.cube.locked { cursor: default; }
.cube.wobble { animation: wobble .35s linear; }
@keyframes wobble { 0% { transform: rotate(0) } 20% { transform: rotate(-.14rad) } 40% { transform: rotate(.14rad) }
  60% { transform: rotate(-.09rad) } 80% { transform: rotate(.09rad) } 100% { transform: rotate(0) } }
#cube-a { animation: popin .35s cubic-bezier(.34, 1.56, .64, 1) both, pulse .4s ease-in-out .35s 2; }
@keyframes popin { from { transform: scale(0) } to { transform: scale(1) } }
@keyframes pulse { 50% { transform: scale(1.12) } }
#cube-a.press { animation: none; transform: scale(.92); transition: transform .08s; }
#cube-a.go { animation: go .7s ease-in-out infinite; }
@keyframes go { 0% { transform: scale(.92) } 35% { transform: scale(1.14) } 100% { transform: scale(1.06) } }
#stage.leaving .cube.locked, #stage.leaving .rb { opacity: .55; transition: opacity .3s; }
/* черта под алфавитом — тёплая бежевая, скруглённые концы */
#divider { position: absolute; height: 4px; border-radius: 99px; background: #CDBFA6; pointer-events: none; }
/* ряд круглых кнопок (пока пустые): светлая грань, пастельный ободок, тёмный контур и «толщина» снизу — как у кубиков */
#bottombar { position: absolute; left: 0; right: 0; }
.rb { position: absolute; box-sizing: border-box; padding: 0; margin: 0; border-radius: 50%; cursor: pointer; outline: none;
  -webkit-appearance: none; appearance: none; background: #FBF7EE; border: solid #4A3F33;
  transition: transform .12s ease-out; }
.rb.press { transform: scale(.88); transition: transform .06s ease-in; }
/* «i» — сведения для взрослых: маленькая приглушённая кнопка в левом нижнем углу (место выбирает layout(), не на кубиках) */
#info-btn { position: absolute; box-sizing: border-box; padding: 0; margin: 0; border-radius: 50%; cursor: pointer; outline: none;
  -webkit-appearance: none; appearance: none; background: #F7F0DE; border: 1.5px solid #8A7660; color: #5A5A5A;
  font: italic 700 20px/1 Georgia, "Times New Roman", serif; display: flex; align-items: center; justify-content: center;
  opacity: .85; transition: transform .12s ease-out; }
#info-btn.press { transform: scale(.9); }
/* страница сведений: лёгкий HTML-слой поверх главной (Godot не грузится); текст — web-home/info.html */
#info { position: fixed; inset: 0; z-index: 20; display: none; background: #F7F0DE; color: #3C3228; }
#info.open { display: block; }
#info-scroll { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  touch-action: pan-y; -webkit-user-select: text; user-select: text;
  padding: calc(env(safe-area-inset-top, 0px) + 64px) calc(env(safe-area-inset-right, 0px) + 22px) calc(env(safe-area-inset-bottom, 0px) + 36px) calc(env(safe-area-inset-left, 0px) + 22px); box-sizing: border-box; }
#info-text { max-width: 680px; margin: 0 auto; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
#info-text h1 { font-size: 25px; line-height: 1.25; margin: 0 0 12px; }
#info-text h2 { font-size: 19px; margin: 22px 0 6px; }
#info-text p, #info-text ul { margin: 0 0 10px; }
#info-text ul { padding-left: 22px; }
#info-text li { margin: 4px 0; }
/* крестик — тёмно-серый (не красный), в правом верхнем углу, крупная зона касания */
#info-close { position: fixed; z-index: 21; top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px);
  width: 48px; height: 48px; padding: 0; margin: 0; border: 0; border-radius: 50%; background: rgba(247,240,222,.92); cursor: pointer;
  -webkit-appearance: none; appearance: none; outline: none; }
#info-close::before, #info-close::after { content: ""; position: absolute; left: 12px; top: 22.5px; width: 24px; height: 3px; border-radius: 2px; background: #4A4A4A; }
#info-close::before { transform: rotate(45deg); } #info-close::after { transform: rotate(-45deg); }
</style>
</head>
<body>
<div id="vp" aria-hidden="true"></div>
<div id="stage">
  <div id="topbar" aria-hidden="true"></div>
  <div id="letters" role="group" aria-label="Буквы"></div>
  <div id="divider" aria-hidden="true"></div>
  <div id="bottombar" role="toolbar" aria-label="Кнопки"></div>
  <button id="info-btn" type="button" aria-label="Для взрослых: как устроен Букварь">i</button>
</div>
<div id="info" role="dialog" aria-modal="true" aria-label="Как устроен Букварь">
  <div id="info-scroll"><div id="info-text"></div></div>
  <button id="info-close" type="button" aria-label="Закрыть и вернуться к буквам"></button>
</div>
<script>
(function () {
  "use strict";
  var ALPHABET = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ", ACTIVE = "А";
  var ORDER = [1, 0, 5, 6, 3, 0, 4, 6, 2, 4, 1, 2, 5, 1, 5, 3, 6, 5, 0, 6, 2, 0, 4, 1, 3, 4, 1, 3, 6, 2, 0, 5, 2];
  var VOWELS = "АЕЁИОУЫЭЮЯ";
  // открытая буква / закрытая (= цвет.lerp(#ECE7DC, 0.55))
  var COL = { v: "#D93A2B", c: "#2F6DB5", s: "#3C3228" }, COL_LOCK = { v: "#E3998C", c: "#97B0CA", s: "#9D968B" };
  // кубик 124 → шаг 138×136 (пропорции letters_menu.gd); остальное — в единицах «сцены» 1024×768, см. layout()
  var W = 1024, H = 768, SX = 138 / 124, SY = 136 / 124;
  var TOP_BAR = 72, BTN = 88, BTN_MIN = 64, BTN_FLOOR = 44, BTN_GAP = 40, BAR_PAD_T = 14, BAR_PAD_B = 20, DIV_H = 4, DIV_GAP = 14, SIDE = 28;
  var EDGE_X = 12, EDGE_B = 10;   // минимум от боковых краёв и от низа видимой области (px)
  var BTN_COLORS = ["#F6B9C0", "#F9CB9C", "#F6E08E", "#CDE9DC", "#BEDCEE", "#C9CAF0"];   // «мягкая радуга», без красного
  var BTN_DEPTH = ["#D9949C", "#DDA877", "#D4BC62", "#A6CDBB", "#94BCD6", "#A3A4D6"];
  // руки-подсказки на главной нет (решение заказчика): подсказка при бездействии — только в играх урока
  var INFO_URL = "info.html";   // текст страницы «i» — общий для всех уроков, правится в этом файле
  var LESSON = "lesson-a/";
  var PASS = ["debug", "junior", "hint_sec", "test", "fast", "audio"];   // параметры, которые уходят в урок

  var q = new URLSearchParams(location.search);
  var flag = function (k) { return q.has(k) && q.get(k) !== "0" && q.get(k) !== "false"; };
  var lq = new URLSearchParams();
  PASS.forEach(function (k) { if (q.has(k)) lq.set(k, q.get(k)); });
  var lessonHref = LESSON + (lq.toString() ? "?" + lq.toString() : "");

  var stage = document.getElementById("stage"), letters = document.getElementById("letters"), divider = document.getElementById("divider"),
    bar = document.getElementById("bottombar"), topbar = document.getElementById("topbar");
  var cubeA = null, cubeLocked = null, state = "wait_letter", cubes = [], btns = [];
  for (var i = 0; i < ALPHABET.length; i++) {
    var ch = ALPHABET[i], locked = ch !== ACTIVE;
    var b = document.createElement("button");
    b.className = "cube" + (locked ? " locked" : "");
    b.style.backgroundImage = "url(assets/cube_" + ORDER[i] + (locked ? "_lock" : "") + ".webp)";
    b.setAttribute("aria-label", "Буква " + ch + (locked ? " (пока закрыта)" : ""));
    var kind = VOWELS.indexOf(ch) >= 0 ? "v" : (ch === "Ь" || ch === "Ъ") ? "s" : "c";
    var s = document.createElement("span"); s.textContent = ch; s.style.color = (locked ? COL_LOCK : COL)[kind];
    b.appendChild(s); letters.appendChild(b); cubes.push(b);
    if (!locked) { b.id = "cube-a"; cubeA = b; }
    else {
      if (ch === "Б") cubeLocked = b;
      b.addEventListener("pointerdown", wobble);
    }
  }
  // нижний ряд: 6 пустых круглых кнопок (data-slot 1…6) — пока только «нажимаются», действий нет
  for (var j = 0; j < 6; j++) {
    var r = document.createElement("button");
    r.className = "rb"; r.type = "button"; r.dataset.slot = String(j + 1);
    r.setAttribute("aria-label", "Кнопка " + (j + 1) + " (пока пустая)");
    r.style.borderColor = "#4A3F33"; r.dataset.color = BTN_COLORS[j];
    bar.appendChild(r); btns.push(r); rb_on(r);
  }
  function rb_on(r) {
    var off = function () { r.classList.remove("press"); };
    r.addEventListener("pointerdown", function () { if (state !== "leaving") r.classList.add("press"); });
    r.addEventListener("pointerup", off); r.addEventListener("pointerleave", off); r.addEventListener("pointercancel", off);
  }
  // «i» и страница сведений
  var infoBtn = document.getElementById("info-btn"), info = document.getElementById("info"), infoText = document.getElementById("info-text"),
    infoScroll = document.getElementById("info-scroll"), infoClose = document.getElementById("info-close"), infoLoaded = false, infoPushed = false;
  function loadInfo() {
    if (infoLoaded) return;
    infoLoaded = true;
    fetch(INFO_URL, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (t) { infoText.innerHTML = t; publish(); })
      .catch(function () { infoLoaded = false; infoText.innerHTML = "<h1>Как устроен Букварь</h1><p>Не удалось загрузить текст. Проверьте интернет и откройте ещё раз.</p>"; });
  }
  function openInfo() {
    if (state !== "wait_letter") return;
    loadInfo(); state = "info"; info.classList.add("open"); infoScroll.scrollTop = 0;
    try { history.pushState({ bkInfo: 1 }, ""); infoPushed = true; } catch (e) { infoPushed = false; }
    publish();
  }
  function hideInfo() {
    if (state !== "info") return;
    info.classList.remove("open"); state = "wait_letter"; publish();
  }
  function closeInfo() {   // крестик / Esc: назад по истории (тогда «назад» в браузере не уводит со страницы), иначе просто спрятать
    if (state !== "info") return;
    if (infoPushed && history.state && history.state.bkInfo) { infoPushed = false; history.back(); setTimeout(hideInfo, 400); } else hideInfo();
  }
  window.addEventListener("popstate", function () { infoPushed = false; hideInfo(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeInfo(); });
  (function () {
    var off = function () { infoBtn.classList.remove("press"); };
    infoBtn.addEventListener("pointerdown", function () { if (state === "wait_letter") infoBtn.classList.add("press"); });
    infoBtn.addEventListener("pointerup", off); infoBtn.addEventListener("pointerleave", off); infoBtn.addEventListener("pointercancel", off);
    infoBtn.addEventListener("click", openInfo);
    infoClose.addEventListener("click", closeInfo);
  })();
  setTimeout(loadInfo, 600);   // заранее, чтобы страница открывалась мгновенно

  function wobble(e) {
    var c = e.currentTarget; c.classList.remove("wobble"); void c.offsetWidth; c.classList.add("wobble");
  }
  c_on(cubeA);
  function c_on(a) {
    // отклик — сразу на касание; переход — когда палец отпущен на кубике (click не ждём: на части планшетов он запаздывает)
    var down = false;
    a.addEventListener("pointerdown", function () { if (state !== "leaving") { down = true; a.classList.add("press"); } });
    a.addEventListener("pointerup", function () { if (down) { down = false; go(); } });
    a.addEventListener("pointerleave", function () { down = false; if (state !== "leaving") a.classList.remove("press"); });
    a.addEventListener("pointercancel", function () { down = false; if (state !== "leaving") a.classList.remove("press"); });
    a.addEventListener("click", go);   // клавиатура / программный клик
  }
  function go() {
    if (state === "leaving") return;
    state = "leaving"; publish();
    cubeA.classList.remove("press"); cubeA.classList.add("go"); stage.classList.add("leaving");
    setTimeout(function () { location.href = lessonHref; }, 160);
  }
  // возврат кнопкой «назад» (страница из bfcache) — снова ждём тап
  window.addEventListener("pageshow", function (e) {
    if (e.persisted) { state = "wait_letter"; cubeA.classList.remove("go", "press"); stage.classList.remove("leaving"); info.classList.remove("open"); publish(); }
  });

  // раскладка в пикселях окна. s — масштаб «сцены» 1024×768 (как раньше); полосы: верх TOP_BAR·s (место под меню),
  // внизу ряд кнопок (BTN·s, но не меньше BTN_MIN px — палец ребёнка), над ним черта; кубики — максимально крупные в
  // оставшейся области. 4:3 — всегда 7×5; на широких экранах берём 9×4 / 11×3, если кубики выходят заметно крупнее.
  var s = 1, cube = 124, gx = 0, gy = 0, cols = 7, ax0 = 0, ay0 = 0;
  function gridFit(n, aw, ah) {
    var rows = Math.ceil(ALPHABET.length / n);
    return Math.min(aw / ((n - 1) * SX + 1), ah / ((rows - 1) * SY + 1));
  }
  // видимая область: минимум из всех источников (visualViewport — без панелей браузера; dvh-зонд; innerHeight; clientHeight),
  // чтобы ничего не ушло под адресную строку / нижнюю панель Safari / системную навигацию Android
  var probe = document.getElementById("vp");
  function viewport() {
    var vv = window.visualViewport, de = document.documentElement, pr = probe.getBoundingClientRect();
    var ws = [window.innerWidth, de.clientWidth || 1e9, pr.width || 1e9], hs = [window.innerHeight, de.clientHeight || 1e9, pr.height || 1e9];
    if (vv && vv.width > 0) { var z = vv.scale > 1 ? vv.scale : 1; ws.push(vv.width * z); hs.push(vv.height * z); }
    var cs = getComputedStyle(probe), px = function (v) { return parseFloat(v) || 0; };
    return { w: Math.floor(Math.min.apply(null, ws)), h: Math.floor(Math.min.apply(null, hs)),
      it: px(cs.paddingTop), ir: px(cs.paddingRight), ib: px(cs.paddingBottom), il: px(cs.paddingLeft) };
  }
  var lastKey = "", vpInfo = null;
  var infoRect = null;
  function layout() { layoutPass(0); if (!placeInfo()) { layoutPass(infoSize() + 8); placeInfo(true); } }
  // размер «i»: примерно половина круглой кнопки, 32…42 px
  var btnNow = 64;
  function infoSize() { return Math.round(Math.max(32, Math.min(42, btnNow * 0.5))); }
  var geo = {};
  // место для «i» (по порядку): 1) слева от ряда кнопок, в нижнем левом углу; 2) там же, но над рядом — у левого конца
  // черты, если под кубиками есть свободная полоса (телефон вертикально); 3) пустая клетка слева в последнем ряду
  // кубиков (ряд короче и стоит по центру); 4) ряд кнопок ужимается и освобождает угол (force). Никогда — на кубиках.
  function placeInfo(force) {
    var g = geo, iS = infoSize(), x, y, ok = false;
    if (g.bx - g.L0 >= EDGE_X + iS + 8 || force) {
      x = g.L0 + EDGE_X; y = g.barTop + g.padT + (g.btn - iS) / 2; ok = true;
    } else if (g.barTop - g.gridB >= iS + 12) {
      x = g.L0 + EDGE_X;
      y = (x + iS <= g.divL - 6) ? g.dTop + g.divH / 2 - iS / 2 : g.dTop - 6 - iS;   // на линии черты (левее её) или над ней
      y = Math.min(y, g.barTop - iS - 4);
      ok = y >= g.gridB + 6;
    }
    if (!ok && g.lastOff >= 1 && iS <= g.cube) {
      var cellR = g.gx + g.lastOff * g.stx - (g.stx - g.cube);   // правый край свободного места до первого кубика ряда
      x = Math.max(g.L0 + EDGE_X, g.gx + (Math.min(cellR, g.gx + g.cube) - g.gx - iS) / 2);
      y = g.lastTop + g.cube - iS - Math.round(g.cube * 0.06);
      ok = x + iS <= cellR - 4;
    }
    if (!ok) return false;
    x = Math.round(x); y = Math.round(y);
    infoBtn.style.width = infoBtn.style.height = iS + "px"; infoBtn.style.left = x + "px"; infoBtn.style.top = y + "px";
    infoBtn.style.fontSize = Math.round(iS * 0.56) + "px";
    infoRect = [x, y, iS];
    return true;
  }
  function layoutPass(resv) {
    var V = viewport(); vpInfo = V;
    var vw = V.w, vh = V.h;
    stage.style.width = vw + "px"; stage.style.height = vh + "px";
    // рабочая область внутри вырезов экрана
    var L0 = V.il, R0 = vw - V.ir, T0 = V.it, B0 = vh - V.ib, aw = R0 - L0, ah = B0 - T0;
    s = Math.min(aw / W, ah / H);
    // кнопки: 88·s (не меньше 64), но ряд из 6 обязан влезть по ширине (поля ≥ 12 px) и занимать не больше ~17 % высоты
    var sideB = Math.max(EDGE_X, Math.round(SIDE * s)), gapK = 0.36;
    var rowW = aw - 2 * sideB - 2 * resv, btnW = rowW / (6 + 5 * gapK);      // предел по ширине; на узких — промежутки уже
    if (btnW < 52) btnW = rowW / (6 + 5 * 0.2);
    if (btnW < BTN_FLOOR) btnW = (rowW - 5 * 6) / 6;
    var btn = Math.max(BTN_MIN, BTN * s);
    btn = Math.min(btn, btnW, Math.max(BTN_FLOOR, ah * 0.17));
    btn = Math.floor(Math.max(Math.min(BTN_FLOOR, btnW), btn));   // ≥ 44, если ширина позволяет; иначе — сколько влезает
    var bgap = Math.floor(Math.min(Math.max(BTN_GAP * s, btn * 0.3), (aw - 2 * sideB - 2 * resv - 6 * btn) / 5));
    var depth = Math.max(3, Math.round(btn * 0.055));
    // вертикальные полосы; на низких экранах верх и зазоры ужимаются
    var tight = Math.min(1, ah / 600);
    var top = Math.round(TOP_BAR * s * (0.6 + 0.4 * tight));
    var padT = Math.round(Math.max(6, BAR_PAD_T * s)), padB = Math.round(Math.max(EDGE_B, BAR_PAD_B * s)) + depth;
    var barH = btn + padT + padB, divH = Math.max(3, Math.round(DIV_H * s)), gap = Math.round(Math.max(6, DIV_GAP * s));
    var side = Math.max(EDGE_X, Math.round(SIDE * s)), areaTop = T0 + top;
    var areaH = B0 - top - T0 - barH - divH - 2 * gap, areaW = aw - 2 * side;
    // выбор сетки: 7×5 остаётся, если другая сетка не даёт кубик крупнее хотя бы на 12 % (4:3 и iPad Air — всегда 7×5)
    var c7 = gridFit(7, areaW, areaH), best = 7, bestC = c7;
    (aw >= ah ? [9, 11] : [5, 4]).forEach(function (n) { var c = gridFit(n, areaW, areaH); if (c > bestC) { best = n; bestC = c; } });
    if (bestC < c7 * 1.12) { best = 7; bestC = c7; }
    cols = best; cube = Math.max(20, Math.floor(Math.min(bestC, 124 * s * 1.35)));
    var rows = Math.ceil(ALPHABET.length / cols), stx = cube * SX, sty = cube * SY;
    var gw = (cols - 1) * stx + cube, gh = (rows - 1) * sty + cube;
    gx = Math.round(L0 + (aw - gw) / 2); gy = Math.round(areaTop + (areaH - gh) / 2);
    var lastN = ALPHABET.length - (rows - 1) * cols, lastOff = (cols - lastN) / 2;
    var fs = cube * 52 / 124;
    for (var i = 0; i < cubes.length; i++) {
      var row = Math.floor(i / cols), col = i % cols + (row === rows - 1 ? lastOff : 0), b = cubes[i];
      b.style.width = b.style.height = cube + "px";
      b.style.left = Math.round(gx + col * stx) + "px"; b.style.top = Math.round(gy + row * sty) + "px";
      b.firstChild.style.fontSize = fs.toFixed(1) + "px";
    }
    ax0 = gx; ay0 = gy;
    topbar.style.top = T0 + "px"; topbar.style.height = top + "px";
    // черта: по ширине сетки (без тени кубика справа), между кубиками и кнопками
    var barTop = B0 - barH, dTop = barTop - gap - divH, dw = Math.round(Math.min(gw - cube * 0.08, aw - 2 * side));
    divider.style.left = Math.round(L0 + (aw - dw) / 2) + "px"; divider.style.width = dw + "px";
    divider.style.top = dTop + "px"; divider.style.height = divH + "px";
    // кнопки: по центру, равные промежутки
    var rw = 6 * btn + 5 * bgap, bx = Math.round(L0 + (aw - rw) / 2);
    bar.style.top = barTop + "px"; bar.style.height = barH + "px";
    var ring = Math.max(3, Math.round(btn * 0.085)), ink = Math.max(1.5, Math.round(btn * 0.028));
    for (var j = 0; j < btns.length; j++) {
      var r = btns[j];
      r.style.width = r.style.height = btn + "px";
      r.style.left = (bx + j * (btn + bgap)) + "px"; r.style.top = padT + "px";
      r.style.borderWidth = ink + "px";
      r.style.boxShadow = "inset 0 0 0 " + ring + "px " + BTN_COLORS[j] + ", inset 0 " + (-Math.round(ring * 0.5)) + "px 0 " + ring + "px " + BTN_DEPTH[j] +
        ", 0 " + depth + "px 0 0 " + BTN_DEPTH[j] + ", 0 " + depth + "px 0 " + ink + "px #4A3F33, 0 " + (depth + 3) + "px " + Math.round(depth * 1.6) + "px rgba(60,50,40,.2)";
    }
    btnNow = btn;
    geo = { L0: L0, bx: bx, barTop: barTop, padT: padT, btn: btn, gx: gx, stx: stx, cube: cube, lastOff: lastOff, lastTop: Math.round(gy + (rows - 1) * sty),
      gridB: gy + gh, dTop: dTop, divH: divH, divL: Math.round(L0 + (aw - dw) / 2) };
    stage.style.visibility = "visible";
    lastKey = [vw, vh, V.it, V.ir, V.ib, V.il].join(",");
  }
  layout();
  // пересчёт: поворот, панели браузера появились/спрятались, зум, возврат на страницу; плюс сторож раз в 0,4 с —
  // на iOS после поворота размеры иногда приходят с опозданием и без события resize
  function relayout() { layout(); if (typeof publish === "function") publish(); }
  window.addEventListener("resize", relayout);
  if (window.visualViewport) { visualViewport.addEventListener("resize", relayout); visualViewport.addEventListener("scroll", relayout); }
  window.addEventListener("orientationchange", function () { [50, 200, 500, 1000].forEach(function (t) { setTimeout(relayout, t); }); });
  window.addEventListener("pageshow", relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);
  setInterval(function () { var V = viewport(); if ([V.w, V.h, V.it, V.ir, V.ib, V.il].join(",") !== lastKey) relayout(); }, 400);
  // страница не должна прокручиваться ни при каких условиях (iOS может сдвинуть её при «резиновом» скролле)
  // (кроме текста страницы «i» — он прокручивается сам по себе)
  document.addEventListener("touchmove", function (e) { if (!infoScroll.contains(e.target)) e.preventDefault(); }, { passive: false });
  window.addEventListener("scroll", function () { if (window.scrollX || window.scrollY) window.scrollTo(0, 0); });

  // для автотеста: координаты целей в CSS-пикселях окна
  function center(el) { var r = el.getBoundingClientRect(); return [Math.round(r.left + r.width / 2), Math.round(r.top + r.height / 2)]; }
  function publish() {
    var t = { letter_a: center(cubeA), letter_locked: center(cubeLocked), buttons: btns.map(center) };
    var rect = function (el) { var r = el.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]; };
    t.info_btn = center(infoBtn);
    if (state === "info") t.info_close = center(infoClose);
    window.__home = { step: "home", state: state, targets: t, lesson_href: lessonHref,
      scale: s, cube: cube, cols: cols, button: btns[0].offsetWidth, viewport: vpInfo,
      info_rect: rect(infoBtn), cube_rects: cubes.map(rect), button_rects: btns.map(rect),
      info_text_len: infoText.textContent.length, info_scroll: [infoScroll.scrollHeight, infoScroll.clientHeight] };
  }
  publish(); setInterval(publish, 250);

  // старый сервис-воркер Godot, раньше жил в корне сайта, — убрать (у урока теперь свой, в lesson-a/)
  if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
    var here = new URL(".", location.href).href;
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { if (r.scope === here) r.unregister(); });
    }).catch(function () {});
  }
})();
</script>
