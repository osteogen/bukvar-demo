<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ECE3D0">
<title>Букварь — буквы</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preload" href="assets/dejavu-sans-bold-cyr.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/ptsans-bold-cap.woff2" as="font" type="font/woff2" crossorigin>
<!-- Главная страница: лёгкая копия экрана букв из Godot (menu/letters_menu.gd). Godot (~67 МБ) грузится только
     после тапа по «А» — на странице lesson-a/. Сетка, палитра и цвета — как в letters_menu.gd. -->
<style>
/* подписи разделов — PT Sans Bold (как в макете layout_v3), подмножество только из букв подписей */
@font-face { font-family: "PTSansCap"; src: url("assets/ptsans-bold-cap.woff2") format("woff2"); font-weight: 700; font-display: block; }
@font-face { font-family: "DejaVuBk"; src: url("assets/dejavu-sans-bold-cyr.woff2") format("woff2"); font-weight: 700; font-display: block; }
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #ECE3D0; }
body { position: fixed; inset: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
/* #stage — ровно видимая область (размер ставит layout() по visualViewport), всё внутри; ничего не выходит за край */
#stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; visibility: hidden; }
/* зонд: видимая высота (dvh) и вырезы экрана (safe-area: «чёлка», полоска «домой» на iPhone/iPad) */
#vp { position: fixed; left: 0; top: 0; width: 100%; height: 100%; height: 100dvh; visibility: hidden; pointer-events: none;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
  box-sizing: border-box; }
/* экран (макет home_sections/mock_v3, вариант B): сверху сетка букв (7×5; на широких 9×4 / 11×3, на узких 5×7 / 4×9), под ней ряд из 6 значков-разделов с подписями,
   «i» — слева внизу. Размеры задаёт layout() в JS. */
#topbar { position: absolute; left: 0; right: 0; top: 0; }
.cube { position: absolute; width: 124px; height: 124px; padding: 0; margin: 0; border: 0; outline: none; cursor: pointer;
  background: transparent center / 100% 100% no-repeat; -webkit-appearance: none; appearance: none; }
/* лицевая грань кубика: 9.7/19.4/93 из 124 (как в letters_menu.gd); шрифт 52/124 от кубика — задаётся в JS */
.cube span { position: absolute; left: 7.823%; top: 15.645%; width: 75%; height: 75%; display: flex; align-items: center;
  justify-content: center; font: 700 52px/normal "DejaVuBk", "DejaVu Sans", sans-serif; pointer-events: none; }
.cube.locked { cursor: default; }
.cube.wobble { animation: wobble .25s linear; }
@keyframes wobble { 0% { transform: rotate(0) } 20% { transform: rotate(-.14rad) } 40% { transform: rotate(.14rad) }
  60% { transform: rotate(-.09rad) } 80% { transform: rotate(.09rad) } 100% { transform: rotate(0) } }
#cube-a { animation: popin .35s cubic-bezier(.34, 1.56, .64, 1) both, pulse .4s ease-in-out .35s 2; }
@keyframes popin { from { transform: scale(0) } to { transform: scale(1) } }
@keyframes pulse { 50% { transform: scale(1.12) } }
#cube-a.press { animation: none; transform: scale(.92); transition: transform .08s; }
#cube-a.go { animation: go .7s ease-in-out infinite; }
@keyframes go { 0% { transform: scale(.92) } 35% { transform: scale(1.14) } 100% { transform: scale(1.06) } }
#stage.leaving .cube:not(#cube-a), #stage.leaving .rb, #stage.leaving #set-btn { opacity: .55; transition: opacity .3s; }
/* ряд разделов (вариант B): значки без подложки и без табличек, подпись под значком — тёмный жирный шрифт по центру.
   Кнопка = квадрат значка; подпись висит под ним (ширина — шаг ряда, переносится на 2 строки на узких экранах). */
#bottombar { position: absolute; left: 0; right: 0; }
.rb { position: absolute; box-sizing: border-box; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer; outline: none;
  -webkit-appearance: none; appearance: none; overflow: visible; transition: transform .12s ease-out; transform-origin: 50% 60%; }
.rb img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; -webkit-user-drag: none; user-select: none; }
.rb .cap { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); text-align: center; color: #3C3228;
  font: 700 15px/1.12 "PTSansCap", "PT Sans", "DejaVuBk", "DejaVu Sans", sans-serif; white-space: normal; overflow-wrap: normal;
  word-break: keep-all; hyphens: none; pointer-events: none; }
.rb:focus-visible { outline: 3px solid #2F6DB5; outline-offset: 3px; border-radius: 12px; }
.rb.press { transform: scale(.9); transition: transform .06s ease-in; }
/* закрытый раздел: «тук» + покачивание 250 мс (свойство rotate — не мешает сжатию .press через transform) */
.rb.wobble { animation: rbwob .25s linear; }
@keyframes rbwob { 0% { rotate: 0rad } 20% { rotate: -.12rad } 40% { rotate: .12rad } 60% { rotate: -.07rad } 80% { rotate: .07rad } 100% { rotate: 0rad } }
/* «i» — сведения для взрослых: маленькая приглушённая кнопка в левом нижнем углу (место выбирает layout(), не на кубиках) */
#info-btn { position: absolute; box-sizing: border-box; padding: 0; margin: 0; border-radius: 50%; cursor: pointer; outline: none;
  -webkit-appearance: none; appearance: none; background: #F7F0DE; border: 1.5px solid #8A7660; color: #5A5A5A;
  display: flex; align-items: center; justify-content: center;
  opacity: .85; transition: transform .12s ease-out; }
#info-btn.press { transform: scale(.9); }
#info-btn svg { display: block; flex: none; pointer-events: none; }   /* «i» нарисована (точка + ножка), её рамка = центр круга */
/* шестерёнка — настройки: голый значок без круга и рамки, бледнее «i» (#B5AA97 на #ECE3D0 ≈ 1,8:1 — видна, но не бросается
   в глаза; при нажатии темнее), «вес» — как у «i», зеркально кнопке «i» (справа, на том же уровне);
   зона касания ≥ 44×44 px, значок по центру зоны. Место ставит placeInfo(). */
#set-btn { position: absolute; box-sizing: border-box; padding: 0; margin: 0; border: 0; background: transparent; cursor: pointer; outline: none;
  -webkit-appearance: none; appearance: none; display: flex; align-items: center; justify-content: center;
  transition: transform .12s ease-out; -webkit-tap-highlight-color: transparent; }
#set-btn svg { display: block; pointer-events: none; }
#set-btn svg path { fill: #B5AA97; transition: fill .12s; }
#set-btn.press { transform: scale(.9); }
#set-btn.press svg path, #set-btn:focus-visible svg path { fill: #9C907C; }
#set-btn:focus-visible, #info-btn:focus-visible { outline: 3px solid #2F6DB5; outline-offset: 2px; }
/* страница сведений: лёгкий HTML-слой поверх главной (Godot не грузится); текст — web-home/info.html */
#info, #settings { position: fixed; inset: 0; z-index: 20; display: none; background: #F7F0DE; color: #3C3228; }
#info.open, #settings.open { display: block; }
#info-scroll, #settings-scroll { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  touch-action: pan-y; -webkit-user-select: text; user-select: text;
  padding: calc(env(safe-area-inset-top, 0px) + 64px) calc(env(safe-area-inset-right, 0px) + 22px) calc(env(safe-area-inset-bottom, 0px) + 36px) calc(env(safe-area-inset-left, 0px) + 22px); box-sizing: border-box; }
#info-text, #settings-text { max-width: 680px; margin: 0 auto; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
#info-text h1, #settings-text h1 { font-size: 25px; line-height: 1.25; margin: 0 0 12px; }
#info-text h2 { font-size: 19px; margin: 22px 0 6px; }
#info-text p, #info-text ul, #settings-text p { margin: 0 0 10px; }
#settings-text label { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; cursor: pointer; }
#settings-text input[type=checkbox] { flex: none; width: 26px; height: 26px; margin: 1px 0 0; accent-color: #2F6DB5; cursor: pointer; }
#settings-text .note { color: #6E6458; font-size: 15px; }
#info-text ul { padding-left: 22px; }
#info-text li { margin: 4px 0; }
/* крестик — тёмно-серый (не красный), в правом верхнем углу, крупная зона касания */
#info-close, #settings-close { position: fixed; z-index: 21; top: calc(env(safe-area-inset-top, 0px) + 10px); right: calc(env(safe-area-inset-right, 0px) + 10px);
  width: 48px; height: 48px; padding: 0; margin: 0; border: 0; border-radius: 50%; background: rgba(247,240,222,.92); cursor: pointer;
  -webkit-appearance: none; appearance: none; outline: none; }
#info-close::before, #info-close::after, #settings-close::before, #settings-close::after { content: ""; position: absolute; left: 12px; top: 22.5px; width: 24px; height: 3px; border-radius: 2px; background: #4A4A4A; }
#info-close::before, #settings-close::before { transform: rotate(45deg); } #info-close::after, #settings-close::after { transform: rotate(-45deg); }
</style>
</head>
<body>
<div id="vp" aria-hidden="true"></div>
<div id="stage">
  <div id="topbar" aria-hidden="true"></div>
  <div id="letters" role="group" aria-label="Буквы"></div>
  <div id="bottombar" role="toolbar" aria-label="Кнопки"></div>
  <button id="info-btn" type="button" aria-label="Для взрослых: как устроен Букварь"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"
    fill="#5A5A5A"><circle cx="12" cy="6.8" r="1.8"/><rect x="10.55" y="10.2" width="2.9" height="8.8" rx="1.2"/></svg></button>
  <button id="set-btn" type="button" aria-label="Настройки для взрослых"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="#B5AA97" fill-rule="evenodd" d="M19.55 9.67 L22.39 9.89 L22.39 14.11 L19.55 14.33 L18.99 15.69 L20.84 17.86 L17.86 20.84 L15.69 18.99 L14.33 19.55 L14.11 22.39 L9.89 22.39 L9.67 19.55 L8.31 18.99 L6.14 20.84 L3.16 17.86 L5.01 15.69 L4.45 14.33 L1.61 14.11 L1.61 9.89 L4.45 9.67 L5.01 8.31 L3.16 6.14 L6.14 3.16 L8.31 5.01 L9.67 4.45 L9.89 1.61 L14.11 1.61 L14.33 4.45 L15.69 5.01 L17.86 3.16 L20.84 6.14 L18.99 8.31Z M15.3 12A3.3 3.3 0 1 0 8.7 12A3.3 3.3 0 1 0 15.3 12Z"/></svg></button>
</div>
<div id="info" role="dialog" aria-modal="true" aria-label="Как устроен Букварь">
  <div id="info-scroll"><div id="info-text"></div></div>
  <button id="info-close" type="button" aria-label="Закрыть и вернуться к буквам"></button>
</div>
<div id="settings" role="dialog" aria-modal="true" aria-label="Настройки">
  <div id="settings-scroll"><div id="settings-text">
    <h1>Настройки</h1>
    <label><input type="checkbox" id="set-seq"><span>Открывать буквы по последовательности изучения</span></label>
    <p class="note">Если включено, открыты только пройденные буквы и следующая по порядку изучения, остальные — бледные, до них пока не дойти.
      Если выключено — открыты все буквы. Настройка хранится на этом устройстве.</p>
  </div></div>
  <button id="settings-close" type="button" aria-label="Закрыть и вернуться к буквам"></button>
</div>
<script>
(function () {
  "use strict";
  var ALPHABET = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
  // буквы, у которых уже есть урок (остальные открыты, но на касание — тихий «тук» + покачивание)
  var LESSONS = { "А": "lesson-a/" };
  // порядок изучения букв: по Воскресенской, позиции 3–5 — М, Х, О (руководство 1948 г., решение заказчика 26.10.2026).
  // Ь сначала как знак мягкости, потом — разделительный вместе с Ъ. Тот же порядок — в info.html.
  var STUDY_ORDER = ["А", "У", "М", "Х", "О", "Ш", "Р", "С", "Ы", "Л", "Н", "К", "П", "Т", "В", "З", "Ж", "Ь", "И", "Е", "Д", "Б",
    "Г", "Й", "Ч", "Э", "Ё", "Я", "Ю", "Ц", "Щ", "Ф", "Ъ"];
  var SEQ_KEY = "bukvar.studyOrderLock";   // localStorage: "1" — открывать буквы по последовательности изучения (по умолчанию выкл.)
  var ORDER = [1, 0, 5, 6, 3, 0, 4, 6, 2, 4, 1, 2, 5, 1, 5, 3, 6, 5, 0, 6, 2, 0, 4, 1, 3, 4, 1, 3, 6, 2, 0, 5, 2];
  var VOWELS = "АЕЁИОУЫЭЮЯ";
  // открытая буква / закрытая (= цвет.lerp(#ECE7DC, 0.55))
  var COL = { v: "#D93A2B", c: "#2F6DB5", s: "#3C3228" }, COL_LOCK = { v: "#E3998C", c: "#97B0CA", s: "#9D968B" };
  // кубик 124 → шаг 138×136 (пропорции letters_menu.gd); остальное — в единицах «сцены» 1024×768, см. layout()
  var W = 1024, H = 768, SX = 138 / 124, SY = 136 / 124;
  // макет layout_v3 (планшет 1024×768): сетка с y=28, кубик 100; ряд — кнопка 108, шаг 122 (промежуток 14), подпись 15 px;
  // зазор сетка→ряд 48, снизу 23. Телефон 390×844: кнопка 52, шаг 58, подпись 11 px, подписи «Мои / наклейки», «Язык / жестов» в 2 строки.
  var TOP_PAD = 28, BTN = 108, BTN_FLOOR = 44, GAP_K = 14 / 108, GAP_MIN = 5, ROW_SIDE = 24, ROW_GAP = 48, BOT_PAD = 22, SIDE = 28;
  var CAP = 15, CAP_MIN = 11, CAP_FLOOR = 9, CAP_MAX = 24;
  var EDGE_X = 12, EDGE_B = 10;   // минимум от боковых краёв и от низа видимой области (px)
  // разделы: значок (assets/home_N_key.png — 216×216, 2× кнопки планшета), подпись. Действий пока нет — только отклик.
  var SECTIONS = [["1_alfavit", "Алфавит"], ["2_slogi", "Слоги"], ["3_slova", "Слова"], ["4_chitaem", "Читаем"],
    ["5_nakleyki", "Мои наклейки"], ["6_zhesty", "Язык жестов"]];
  // руки-подсказки на главной нет (решение заказчика): подсказка при бездействии — только в играх урока
  var INFO_URL = "info.html";   // текст страницы «i» — общий для всех уроков, правится в этом файле
  var LESSON = LESSONS["А"];
  var PASS = ["debug", "junior", "hint_sec", "test", "fast", "audio"];   // параметры, которые уходят в урок

  var q = new URLSearchParams(location.search);
  var flag = function (k) { return q.has(k) && q.get(k) !== "0" && q.get(k) !== "false"; };
  var lq = new URLSearchParams();
  PASS.forEach(function (k) { if (q.has(k)) lq.set(k, q.get(k)); });
  var lessonHref = LESSON + (lq.toString() ? "?" + lq.toString() : "");

  var stage = document.getElementById("stage"), letters = document.getElementById("letters"),
    bar = document.getElementById("bottombar"), topbar = document.getElementById("topbar");
  var cubeA = null, cubeLocked = null, state = "wait_letter", cubes = [], btns = [];
  for (var i = 0; i < ALPHABET.length; i++) {
    var ch = ALPHABET[i], b = document.createElement("button");
    b.type = "button"; b.dataset.letter = ch;
    var s = document.createElement("span"); s.textContent = ch;
    b.appendChild(s); letters.appendChild(b); cubes.push(b);
    if (ch === "А") { b.id = "cube-a"; cubeA = b; }
    else {
      if (ch === "Б") cubeLocked = b;   // цель автотеста: буква без урока
      b.addEventListener("pointerdown", lockedTap);   // урока пока нет (или буква закрыта) — «тук» + покачивание
    }
  }
  // какие буквы открыты: по умолчанию (незарегистрированный пользователь) — все; с настройкой «по последовательности» —
  // пройденные + следующая по STUDY_ORDER (пока прогресс не сохраняется → открыта только «А»)
  var lsGet = function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } };
  var lsSet = function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} };
  function seqOn() { return lsGet(SEQ_KEY) === "1"; }
  function doneLetters() { return []; }   // TODO: пройденные буквы — когда появится сохранение прогресса
  function openLetters() {
    if (!seqOn()) return ALPHABET.split("");
    var done = doneLetters(), open = done.slice();
    for (var k = 0; k < STUDY_ORDER.length; k++) if (done.indexOf(STUDY_ORDER[k]) < 0) { open.push(STUDY_ORDER[k]); break; }
    return open;
  }
  var openNow = [];
  function applyLocks() {
    openNow = openLetters();
    for (var k = 0; k < cubes.length; k++) {
      var c = cubes[k], ch = c.dataset.letter, locked = openNow.indexOf(ch) < 0;
      var kind = VOWELS.indexOf(ch) >= 0 ? "v" : (ch === "Ь" || ch === "Ъ") ? "s" : "c";
      c.className = "cube" + (locked ? " locked" : "") + (LESSONS[ch] ? "" : " nolesson");
      c.style.backgroundImage = "url(assets/cube_" + ORDER[k] + (locked ? "_lock" : "") + ".webp)";
      c.firstChild.style.color = (locked ? COL_LOCK : COL)[kind];
      c.setAttribute("aria-label", "Буква " + ch + (locked ? " (пока закрыта)" : LESSONS[ch] ? "" : " (урок скоро)"));
    }
  }
  applyLocks();
  // нижний ряд: 6 разделов (data-slot 1…6, data-section) — пока только «нажимаются», действий нет
  var caps = [];
  for (var j = 0; j < SECTIONS.length; j++) {
    var r = document.createElement("button");
    r.className = "rb"; r.type = "button"; r.dataset.slot = String(j + 1); r.dataset.section = SECTIONS[j][0].slice(2);
    r.setAttribute("aria-label", SECTIONS[j][1] + " (раздел пока закрыт)");
    var im = document.createElement("img"); im.src = "assets/home_" + SECTIONS[j][0] + ".png"; im.alt = ""; im.draggable = false;
    im.width = 216; im.height = 216; im.decoding = "async";
    var cp = document.createElement("span"); cp.className = "cap"; cp.textContent = SECTIONS[j][1]; cp.setAttribute("aria-hidden", "true");
    r.appendChild(im); r.appendChild(cp); caps.push(cp);
    bar.appendChild(r); btns.push(r); rb_on(r);
  }
  function rb_on(r) {
    var off = function () { r.classList.remove("press"); };
    r.addEventListener("pointerdown", function (e) { if (state !== "leaving") { r.classList.add("press"); lockedTap(e); } });
    r.addEventListener("pointerup", off); r.addEventListener("pointerleave", off); r.addEventListener("pointercancel", off);
  }
  // «i» и страница сведений; шестерёнка и страница настроек (тот же вид, крестик справа)
  var infoBtn = document.getElementById("info-btn"), info = document.getElementById("info"), infoText = document.getElementById("info-text"),
    infoScroll = document.getElementById("info-scroll"), infoClose = document.getElementById("info-close"), infoLoaded = false, infoPushed = false;
  var setBtn = document.getElementById("set-btn"), settings = document.getElementById("settings"), setScroll = document.getElementById("settings-scroll"),
    setClose = document.getElementById("settings-close"), setSeq = document.getElementById("set-seq");
  var PAGES = { info: [info, infoScroll], settings: [settings, setScroll] };
  function loadInfo() {
    if (infoLoaded) return;
    infoLoaded = true;
    fetch(INFO_URL, { cache: "no-cache" }).then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (t) { infoText.innerHTML = t; publish(); })
      .catch(function () { infoLoaded = false; infoText.innerHTML = "<h1>Как устроен Букварь</h1><p>Не удалось загрузить текст. Проверьте интернет и откройте ещё раз.</p>"; });
  }
  function openPage(name) {
    if (state !== "wait_letter") return;
    if (name === "info") loadInfo();
    if (name === "settings") setSeq.checked = seqOn();
    state = name; PAGES[name][0].classList.add("open"); PAGES[name][1].scrollTop = 0;
    try { history.pushState({ bkInfo: 1 }, ""); infoPushed = true; } catch (e) { infoPushed = false; }
    publish();
  }
  function openInfo() { openPage("info"); }
  function hideInfo() {
    if (!PAGES[state]) return;
    PAGES[state][0].classList.remove("open"); state = "wait_letter"; publish();
  }
  function closeInfo() {   // крестик / Esc: назад по истории (тогда «назад» в браузере не уводит со страницы), иначе просто спрятать
    if (!PAGES[state]) return;
    if (infoPushed && history.state && history.state.bkInfo) { infoPushed = false; history.back(); setTimeout(hideInfo, 400); } else hideInfo();
  }
  window.addEventListener("popstate", function () { infoPushed = false; hideInfo(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeInfo(); });
  (function () {
    var off = function () { infoBtn.classList.remove("press"); };

  setTimeout(loadInfo, 600);   // заранее, чтобы страница открывалась мгновенно

  // раскладка в пикселях окна по макету layout_v3: s — масштаб «сцены» 1024×768. Сетка букв — 7×5 (4:3), на широких
  // 9×4 / 11×3, на узких 5×7 / 4×9 — та, что даёт самый крупный кубик (неполный последний ряд — по центру), под ней ряд из 6 разделов — всегда в одну строку, кнопки масштабируются по ширине экрана. Сетка и ряд —

  var lastKey = "", vpInfo = null;

  function layout() { layoutPass(0); if (!placeInfo()) { layoutPass(gearSize(infoSize()) + 8); placeInfo(true); } }
  // размер «i»: примерно половина кнопки, 32…42 px
  var btnNow = 64;
  function infoSize() { return Math.round(Math.max(32, Math.min(42, btnNow * 0.5))); }
  var geo = {};

  // если ниже ряда есть свободная полоса (телефон вертикально); 3) пустая клетка слева в последнем ряду кубиков (ряд из 5
  // стоит по центру); 4) ряд кнопок ужимается и освобождает угол (force). Никогда — на кубиках, кнопках и подписях.
  // Шестерёнка в каждом случае — зеркально «i»: тот же центр по высоте, справа на том же расстоянии от R0, что «i» от L0.

  function placeGear(x, y, iS) {

    setBtn.style.width = setBtn.style.height = gS + "px";
    setBtn.style.left = Math.round(geo.L0 + geo.R0 - x - iS / 2 - gS / 2) + "px"; setBtn.style.top = Math.round(y + iS / 2 - gS / 2) + "px";
    setBtn.firstChild.setAttribute("width", gG); setBtn.firstChild.setAttribute("height", gG);
  }
  function placeInfo(force) {
    var g = geo, iS = infoSize(), x, y, ok = false;
    if (g.bx - g.L0 >= EDGE_X + iS + 8 || force) {
      x = Math.max(g.L0 + EDGE_X, Math.min(g.L0 + Math.round(28 * s), g.bx - iS - 8));
      y = g.barTop + (g.btn - iS) / 2; y = Math.min(y, g.B0 - EDGE_B - iS); ok = force || gearFree(g, Math.round(x), Math.round(y), iS);
    } else if (g.B0 - g.rowB >= iS + 2 * EDGE_B + 8) {

      x = Math.max(g.L0 + EDGE_X, g.gx + (Math.min(cellR, g.gx + g.cube) - g.gx - iS) / 2);

  // подписи: ширина = шаг ряда − 2 px (соседние не касаются); перенос по словам; если слово не влезает — шрифт меньше

    // и занимать не больше ~16 % высоты; промежуток 14/108 кнопки, не меньше 5 px
    var sideB = Math.round(Math.min(ROW_SIDE, Math.max(EDGE_X, aw * 0.0615)));
    var rowW = aw - 2 * sideB - 2 * resv, btnW = rowW / (6 + 5 * 0.115);
    if (btnW < BTN_FLOOR) { sideB = EDGE_X; rowW = aw - 2 * sideB - 2 * resv; btnW = (rowW - 5 * GAP_MIN) / 6; }
    var btn = Math.floor(Math.min(BTN * Math.max(s, 0.5), btnW, Math.max(BTN_FLOOR, ah * 0.16)));
    var bgap = Math.floor(Math.min(Math.max(GAP_MIN, Math.round(btn * GAP_K)), (rowW - 6 * btn) / 5));
    if (bgap < GAP_MIN) { btn = Math.floor((rowW - 5 * GAP_MIN) / 6); bgap = GAP_MIN; }
    // подписи: 15 px на планшете, 11 px на телефоне (мельче 11 — только если слово иначе не влезает)
    var capF = Math.round(Math.max(CAP_MIN, Math.min(CAP_MAX, CAP * btn / BTN)) * 2) / 2;
    var capH = fitCaptions(btn, btn + bgap, capF);
    var rowH = btn + capH;
    // вертикально: отступ сверху 28·s, зазор сетка→ряд 48·s, снизу 22·s (не меньше 10 px)
    var top = Math.round(Math.max(8, TOP_PAD * s)), padB = Math.round(Math.max(EDGE_B, BOT_PAD * s)), rgap = Math.round(Math.max(12, ROW_GAP * s));
    var side = Math.max(EDGE_X, sideB, Math.round(SIDE * s));

    // горизонтальных — 9×4 или 11×3, на узких / вертикальных — 5×7 или 4×9. Высота ряда разделов уже вычтена из areaH.
    var c7 = gridFit(7, areaW, areaH), best = 7, bestC = c7;

    cols = best; cube = Math.max(20, Math.floor(Math.min(bestC, capC))); cube7 = Math.max(20, Math.floor(Math.min(c7, capC)));

  window.addEventListener("pageshow", relayout);

    var rect = function (el) { var r = el.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)]; };
